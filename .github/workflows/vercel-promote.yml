name: Promote verified Vercel deployment

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Deployment ID reported by the Vercel release workflow
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install Vercel CLI
        run: npm install --global vercel@59.1.3
      - name: Verify deployment again
        run: bash scripts/smoke-vercel-deployment.sh
      - name: Promote
        run: vercel promote "$DEPLOYMENT_ID" --yes --token="$VERCEL_TOKEN"
      - name: Verify production alias
        run: |
          active=$(vercel inspect www.optibus.id --token="$VERCEL_TOKEN" | grep -F "$DEPLOYMENT_ID")
          test -n "$active"
